<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buat Key — Renzcline Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1e2150;--bg2:#2a2e6b;--card:#f7f7fb;--ink:#14163a;--muted:#5b5f8a;--amber:#ffb703;--ok:#1fa67a;--err:#d6455d;--line:#d9daea}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Sora',system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg));min-height:100vh;padding:20px}
  .wrap{max-width:560px;margin:0 auto}
  h1{color:#fff;font-size:24px;margin:8px 0 18px;letter-spacing:-.02em}
  .card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 14px 36px rgba(8,9,40,.35)}
  h2{margin:0 0 14px;font-size:17px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
  input,select{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:3px solid rgba(255,183,3,.55);border-color:var(--amber)}
  .mono{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .row .small{flex:0 0 auto}
  button{margin-top:14px;padding:13px 16px;border:0;border-radius:10px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
  .primary{background:var(--amber);color:var(--ink);width:100%}
  .ghost{background:#e9eaf5;color:var(--ink)}
  .danger{background:#fde4e8;color:var(--err)}
  button:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:12px;font-size:14px;line-height:1.5}.msg.err{color:var(--err);font-weight:600}.msg.ok{color:var(--ok);font-weight:600}
  progress{width:100%;height:10px;margin-top:12px;display:none}
  .item{border-top:1px solid var(--line);padding:12px 0}
  .item:first-child{border-top:0}
  .item .k{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;letter-spacing:.05em}
  .item .meta{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
  .item .act{display:flex;gap:8px}.item .act button{margin-top:8px;padding:8px 12px;font-size:13px}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#e9eaf5}
  .tag.ok{background:#d8f3ea;color:#127455}.tag.off{background:#fde4e8;color:var(--err)}
  .top{display:flex;justify-content:space-between;align-items:center}
  .top button{margin:0;padding:8px 12px;font-size:13px}
  .hidden{display:none}
  .tabs{display:flex;gap:8px}.tabs button{flex:1;margin-top:0}.tabs .on{background:var(--amber)}
  .note{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Renzcline Admin <small style="font-size:12px;font-weight:600;opacity:.7">Versi 2</small></h1></div>

  <div id="panel">
    <!-- UPLOAD APK -->
    <section class="card">
      <h2>1. Tambah APK</h2>
      <div class="tabs">
        <button class="ghost on" id="tabLink" type="button">Tempel link (cepat)</button>
        <button class="ghost" id="tabFile" type="button">Upload file</button>
      </div>
      <div id="paneLink">
        <p class="note" style="margin-top:12px">Upload APK ke Google Drive, ubah aksesnya jadi "Siapa saja yang memiliki link", lalu tempel link-nya di sini. Link lain yang langsung mengunduh APK juga bisa.</p>
        <label for="apkLinkIn">Link APK</label>
        <input id="apkLinkIn" type="url" placeholder="https://drive.google.com/file/d/...">
      </div>
      <div id="paneFile" class="hidden">
        <p class="note" style="margin-top:12px">Cocok untuk APK kecil. Untuk APK besar, pakai tempel link.</p>
        <label for="apkFile">File APK</label>
        <input id="apkFile" type="file" accept=".apk,application/vnd.android.package-archive">
      </div>
      <label for="apkTitle">Nama game</label>
      <input id="apkTitle" placeholder="Contoh: Game Saya v1.0">
      <progress id="prog" max="100" value="0"></progress>
      <button class="primary" id="upBtn">Simpan APK</button>
      <div class="msg" id="upMsg"></div>
    </section>

    <!-- BUAT KEY -->
    <section class="card">
      <h2>2. Buat key</h2>
      <label for="apkSel">APK yang dibuka key ini</label>
      <select id="apkSel"></select>
      <label for="keyVal">Key</label>
      <div class="row">
        <input id="keyVal" class="mono" placeholder="Kosongkan untuk acak">
        <button class="ghost small" id="rand" type="button" style="margin-top:0">Acak</button>
      </div>
      <label>Lama aktif (dihitung sejak key pertama dipakai)</label>
      <div class="row">
        <input id="dur" type="number" min="1" value="1">
        <select id="unit">
          <option value="jam">Jam</option>
          <option value="hari" selected>Hari</option>
          <option value="permanen">Permanen</option>
        </select>
      </div>
      <label for="buyer">Catatan / nama penyewa (opsional)</label>
      <input id="buyer" placeholder="Contoh: Budi">
      <button class="primary" id="mkBtn">Buat key</button>
      <div class="msg" id="mkMsg"></div>
    </section>

    <!-- DAFTAR KEY -->
    <section class="card">
      <h2>Daftar key</h2>
      <div id="list"></div>
    </section>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, getDocs, deleteDoc, updateDoc, collection, query, orderBy, addDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytesResumable, getDownloadURL, setMaxUploadRetryTime } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDvdO7-YcCM1exGTSZk_fAfuyWL34TEJaw",
    authDomain: "renzcline.firebaseapp.com",
    projectId: "renzcline",
    storageBucket: "renzcline.firebasestorage.app",
    messagingSenderId: "921126801335",
    appId: "1:921126801335:web:37190a9b38f8bd70ebe232",
    measurementId: "G-Z8TZSQ266R"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app), storage = getStorage(app);
  setMaxUploadRetryTime(storage, 15000); // error muncul cepat, tidak macet diam-diam

  const $ = id => document.getElementById(id);
  const say = (el, t, cls) => { el.textContent = t; el.className = "msg " + (cls || ""); };
  let apks = [];

  /* ---------- UPLOAD APK ---------- */
  let mode = "link";
  function setMode(m){
    mode = m;
    $("paneLink").classList.toggle("hidden", m !== "link");
    $("paneFile").classList.toggle("hidden", m !== "file");
    $("tabLink").classList.toggle("on", m === "link");
    $("tabFile").classList.toggle("on", m === "file");
    $("upBtn").textContent = m === "link" ? "Simpan APK" : "Upload APK";
    say($("upMsg"), "");
  }
  $("tabLink").onclick = () => setMode("link");
  $("tabFile").onclick = () => setMode("file");

  function toDirect(u){ // ubah link Google Drive jadi link unduh langsung
    if (!/drive\.google\.com/.test(u)) return u;
    const m = u.match(/\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/);
    return m ? "https://drive.google.com/uc?export=download&id=" + m[1] : u;
  }

  async function saveApk(data){
    await Promise.race([
      addDoc(collection(db, "apks"), { ...data, createdAt: Date.now() }),
      new Promise((_, no) => setTimeout(() => no(new Error("Tidak ada respons dari database. Pastikan Firestore sudah dibuat, rules sudah di-Publish, dan halaman dibuka lewat https.")), 12000))
    ]);
    say($("upMsg"), "APK tersimpan. Sekarang buat key di langkah 2.", "ok");
    $("apkTitle").value = ""; $("apkLinkIn").value = ""; $("apkFile").value = "";
    await loadApks();
  }

  $("upBtn").onclick = async () => {
    if (mode === "link"){
      const raw = $("apkLinkIn").value.trim();
      if (!/^https?:\/\//i.test(raw)) return say($("upMsg"), "Tempel link yang diawali https://", "err");
      const title = $("apkTitle").value.trim() || "Game";
      $("upBtn").disabled = true; say($("upMsg"), "Menyimpan...");
      try{ await saveApk({ title, fileName: title.replace(/[^\w.\- ]/g, "") + ".apk", url: toDirect(raw), size: 0, source: "link" }); }
      catch(e){ say($("upMsg"), "Gagal menyimpan: " + (e.code || e.message), "err"); }
      $("upBtn").disabled = false;
      return;
    }
    const f = $("apkFile").files[0];
    if (!f) return say($("upMsg"), "Pilih file APK dulu.", "err");
    if (!f.name.toLowerCase().endsWith(".apk")) return say($("upMsg"), "File harus berformat .apk.", "err");
    const title = $("apkTitle").value.trim() || f.name;
    const path = "apks/" + Date.now() + "_" + f.name.replace(/[^\w.\-]/g, "_");
    const task = uploadBytesResumable(ref(storage, path), f, {
      contentType: "application/vnd.android.package-archive",
      contentDisposition: 'attachment; filename="' + f.name.replace(/"/g, "") + '"'
    });
    const t0 = Date.now(); let started = false;
    $("upBtn").disabled = true; $("prog").style.display = "block"; $("prog").value = 0;
    say($("upMsg"), "Menyiapkan upload...");
    const watch = setTimeout(() => { if (!started) say($("upMsg"), "Belum ada data terkirim. Cek rules Storage, atau pakai Tempel link.", "err"); }, 20000);
    task.on("state_changed",
      s => {
        if (s.bytesTransferred > 0) started = true;
        const p = s.bytesTransferred / s.totalBytes * 100, sec = (Date.now() - t0) / 1000;
        const mbps = s.bytesTransferred / 1048576 / Math.max(sec, 1);
        $("prog").value = p;
        say($("upMsg"), (s.bytesTransferred / 1048576).toFixed(1) + " / " + (s.totalBytes / 1048576).toFixed(1) + " MB (" + p.toFixed(0) + "%) · " + mbps.toFixed(2) + " MB/dtk");
      },
      err => {
        clearTimeout(watch); console.error(err);
        const why = err.code === "storage/retry-limit-exceeded" ? "Koneksi atau rules Storage bermasalah." : err.code;
        say($("upMsg"), "Upload gagal: " + why + " Coba Tempel link.", "err");
        $("upBtn").disabled = false;
      },
      async () => {
        clearTimeout(watch);
        try{
          const url = await getDownloadURL(task.snapshot.ref);
          await saveApk({ title, fileName: f.name, url, size: f.size, source: "upload" });
        }catch(e){ say($("upMsg"), "Gagal menyimpan: " + (e.code || e.message), "err"); }
        $("upBtn").disabled = false; $("prog").style.display = "none";
      });
  };

  async function loadApks(){
    let snap;
    try{ snap = await getDocs(query(collection(db, "apks"), orderBy("createdAt", "desc"))); }
    catch(e){ console.error(e); $("apkSel").innerHTML = '<option value="">Gagal memuat APK</option>'; say($("upMsg"), "Gagal terhubung ke database: " + (e.code || e.message), "err"); return; }
    apks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    $("apkSel").innerHTML = apks.length
      ? apks.map(a => '<option value="' + a.id + '">' + esc(a.title) + (a.size ? " (" + (a.size / 1048576).toFixed(1) + " MB)" : " (link)") + "</option>").join("")
      : '<option value="">Belum ada APK — upload dulu</option>';
  }

  /* ---------- BUAT KEY ---------- */
  const CH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function randKey(){
    const a = new Uint32Array(12); crypto.getRandomValues(a);
    const s = Array.from(a, n => CH[n % CH.length]).join("");
    return s.slice(0,4) + "-" + s.slice(4,8) + "-" + s.slice(8,12);
  }
  $("rand").onclick = () => $("keyVal").value = randKey();
  $("unit").onchange = () => $("dur").disabled = $("unit").value === "permanen";

  $("mkBtn").onclick = async () => {
    const apk = apks.find(a => a.id === $("apkSel").value);
    if (!apk) return say($("mkMsg"), "Pilih APK dulu.", "err");
    const key = ($("keyVal").value.trim() || randKey()).toUpperCase().replace(/[\/\s]/g, "");
    const unit = $("unit").value, n = Number($("dur").value);
    if (unit !== "permanen" && !(n > 0)) return say($("mkMsg"), "Isi lama aktif dengan angka lebih dari 0.", "err");
    const durationMs = unit === "permanen" ? 0 : n * (unit === "jam" ? 3600000 : 86400000);
    $("mkBtn").disabled = true;
    try{
      if ((await getDoc(doc(db, "keys", key))).exists()) throw new Error("dup");
      await setDoc(doc(db, "keys", key), {
        apkId: apk.id, apkName: apk.fileName, apkUrl: apk.url,
        durationMs, durationLabel: unit === "permanen" ? "Permanen" : n + " " + unit,
        buyer: $("buyer").value.trim(), createdAt: Date.now(), activatedAt: null, expiresAt: null, disabled: false
      });
      say($("mkMsg"), "Key dibuat: " + key, "ok");
      $("keyVal").value = ""; $("buyer").value = "";
      loadKeys();
    }catch(e){
      say($("mkMsg"), e.message === "dup" ? "Key itu sudah ada. Pakai key lain." : "Gagal membuat key: " + (e.code || e.message), "err");
    }finally{ $("mkBtn").disabled = false; }
  };

  /* ---------- DAFTAR KEY ---------- */
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const fmt = t => new Date(t).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });

  async function loadKeys(){
    const snap = await getDocs(query(collection(db, "keys"), orderBy("createdAt", "desc")));
    if (snap.empty){ $("list").innerHTML = '<p class="note">Belum ada key. Buat key pertama di atas.</p>'; return; }
    $("list").innerHTML = snap.docs.map(d => {
      const k = d.data(); let tag;
      if (k.disabled) tag = '<span class="tag off">Nonaktif</span>';
      else if (!k.activatedAt) tag = '<span class="tag">Belum dipakai</span>';
      else if (k.expiresAt && Date.now() > k.expiresAt) tag = '<span class="tag off">Kedaluwarsa</span>';
      else tag = '<span class="tag ok">' + (k.expiresAt ? "Aktif sampai " + fmt(k.expiresAt) : "Aktif permanen") + "</span>";
      return '<div class="item"><div class="k">' + esc(d.id) + "</div>" +
        '<div class="meta">' + tag + " · " + esc(k.durationLabel) + (k.buyer ? " · " + esc(k.buyer) : "") + "<br>" + esc(k.apkName) + "</div>" +
        '<div class="act"><button class="ghost" data-copy="' + esc(d.id) + '">Salin</button>' +
        '<button class="ghost" data-toggle="' + esc(d.id) + '" data-off="' + (k.disabled ? 0 : 1) + '">' + (k.disabled ? "Aktifkan" : "Nonaktifkan") + "</button>" +
        '<button class="danger" data-del="' + esc(d.id) + '">Hapus</button></div></div>';
    }).join("");
  }
  $("list").addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.copy){ await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Tersalin"; }
    else if (b.dataset.toggle){ await updateDoc(doc(db, "keys", b.dataset.toggle), { disabled: b.dataset.off === "1" }); loadKeys(); }
    else if (b.dataset.del && confirm("Hapus key " + b.dataset.del + "?")){ await deleteDoc(doc(db, "keys", b.dataset.del)); loadKeys(); }
  });

  loadApks(); loadKeys();
</script>
</body>
</html>
